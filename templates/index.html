<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Currency Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .flags {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .flag {
            height: 32px;
            width: auto;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #0072ff;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #005dda;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #0072ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="flags">
            <img src="https://flagcdn.com/w40/in.png" alt="India" class="flag">
            <img src="https://flagcdn.com/w40/td.png" alt="Chad" class="flag">
            <img src="https://flagcdn.com/w40/us.png" alt="USA" class="flag">
        </div>
        <h1>Currency Converter</h1>
        <form method="POST">
            <select name="direction" required>
                <option value="inr_to_xof">INR → XOF</option>
                <option value="xof_to_inr">XOF → INR</option>
                <option value="inr_to_usd">INR → USD</option>
                <option value="usd_to_inr">USD → INR</option>
                <option value="xof_to_usd">XOF → USD</option>
                <option value="usd_to_xof">USD → XOF</option>
            </select>
            <input type="text" name="amount" placeholder="Enter amount" required>
            <button type="submit">Convert</button>
        </form>
        {% if result is not none %}
            <div class="result">Result: {{ result }}</div>
        {% endif %}
    </div>
</body>
</html>
